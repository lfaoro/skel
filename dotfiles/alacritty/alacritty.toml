[general]
import = [
  "~/.config/alacritty/themes/themes/catppuccin_mocha.toml",
  # "~/.config/alacritty/themes/themes/catppuccin_macchiato.toml"
  # "~/.config/alacritty/themes/themes/base16_default_dark.toml"
  # "~/.config/alacritty/catppuccin-latte.toml"
  # "~/.config/alacritty/catppuccin-frappe.toml"
  # "~/.config/alacritty/catppuccin-mocha.toml"
]

[cursor]
unfocused_hollow = true
[cursor.style]
blinking = "Never"
shape = "Block"

[window]
# Setting decorations to 'none' removes all window borders and title bar.
decorations = "none"
dynamic_padding = false
opacity = 1
blur = true
startup_mode = "Maximized"
option_as_alt = "OnlyLeft"
[window.padding]
x = 0
y = 0

[font]
size = 15
offset.x = 0
offset.y = 0

[font.normal]
family = "Hack Nerd Font Mono"
style = "Regular"

[font.bold]
family = "Hack Nerd Font Mono"
style = "Bold"

[font.italic]
family = "Hack Nerd Font Mono"
style = "Italic"

[font.bold_italic]
family = "Hack Nerd Font Mono"
style = "Bold Italic"

# [[keyboard.bindings]]
# key = "N"
# mods = "Control|Shift"
# action = "SpawnNewInstance"

[[keyboard.bindings]]
key = "Return"
mods = "Super"

[keyboard.bindings.command]
args = ["-e", "zsh"]
program = "alacritty"

[[keyboard.bindings]]
action = "CopySelection"
key = "C"
mods = "Super"

[[keyboard.bindings]]
action = "ReceiveChar"
key = "Tab"
mods = "Control"

[[keyboard.bindings]]
key = "Period"
mods = "Control"
chars = "\u001b[46;5u"

# Force proper Kitty CSI u sequence for Ctrl+Shift+E so it reaches apps
# inside tmux (used by Grok TUI for "expand/collapse all thinking blocks").
#
# Note: Alacritty 0.17 has no "protocol = 'kitty'" config option (the Kitty
# keyboard protocol is always supported and enabled by the inner app via
# escape sequences). The tmux `extended-keys always` + `alacritty:extkeys`
# settings are the important part on the tmux side.
[[keyboard.bindings]]
key = "E"
mods = "Control|Shift"
chars = "\u001b[69;6u"

# [[keyboard.bindings]]
# action = "None"
# key = ";"
# mods = "Control"

[[keyboard.bindings]]
action = "PasteSelection"
key = "V"
mods = "Super"

[[keyboard.bindings]]
chars = "export HISTFILE=/dev/null"
key = "O"
mods = "Control|Shift"

[[keyboard.bindings]]
chars = "export HISTFILE=/dev/null"
key = "S"
mods = "Control|Shift"

[[keyboard.bindings]]
key = "Semicolon"
mods = "Control"
chars = "\u001b;"

[mouse]
# hide_when_typing = true
bindings = [
  { mouse = "Left", mods = "None", action = "ExpandSelection" },
  { mouse = "Right", mods = "None", action = "Paste" },
]
[selection]
save_to_clipboard = true
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"

[terminal.shell]
args = ["-l", "-c", "tmux new-session -A -s main"]
program = "/usr/bin/zsh"
