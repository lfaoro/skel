{
  "options": {
    "config_plugin": "filesystem",
    "logger_plugin": "filesystem",
    "schedule_splay_percent": 10,
    "disable_distributed": true,
    "disable_carver": true,
    "utc": true
  },
  "schedule": {
    # Note: Queries that hardcode absolute paths have been removed.
    # The service (services.nix) passes portable paths via CLI flags.
    # user_crontabs is portable and safe to keep.
    "user_crontabs": {
      "query": "SELECT command, path FROM crontab",
      "interval": 3600
    }
  },
  "packs": {}
}
