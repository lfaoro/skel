set -g extended-keys always
set -g extended-keys-format csi-u
set -g allow-passthrough on

set -g status on
set -g status-interval 2
set -g status-left ""
set -g status-left-length 100
set -g status-right ""
set -g status-right-length 100

# plugins 
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'

set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'laktak/extrakto'

set -g @plugin 'jabirali/tmux-tilish'
set -g @tilish-default 'main-vertical'
set -g @tilish-project "$HOME/work"
set -g @tilish-enforce 'none'

set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_status_background "default"

set -g @catppuccin_window_number_position 'left'
set -g @catppuccin_window_current_color '#{E:@thm_surface_2}'
set -g @catppuccin_window_current_text '#{b:pane_current_path}'
set -g @catppuccin_window_text '#{window_name}'

set -g allow-rename off
set -g allow-set-title off

set-hook -g after-new-window 'rename-window "#{b:pane_current_path}"'
set-hook -g after-split-window 'rename-window "#{b:pane_current_path}"'

# install `tpm` if needed.
if "test ! -d ~/.tmux/plugins/tpm || test -z \"$(ls -A ~/.tmux/plugins/tpm 2>/dev/null)\"" \
   "run 'rm -rf ~/.tmux/plugins/tpm && command -v git >/dev/null 2>&1 && git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

set -g status-justify "absolute-centre"

set-option -g prefix M-\;
bind-key M-\; send-prefix

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
setw -g alternate-screen on
set -g renumber-windows on
set -g repeat-time 800

set -g default-terminal "tmux-256color"

# Full truecolor + Kitty keyboard protocol (extkeys) support for Alacritty,
# Ghostty, and Kitty. This lets modern TUIs (Grok Build TUI, Helix, etc.)
# receive modified keys such as Ctrl+Shift+E, Shift+Enter, etc. inside tmux.
set -ga terminal-overrides ",alacritty:Tc,xterm-kitty:Tc,ghostty:Tc"
set -as terminal-features ",alacritty:extkeys:RGB:clipboard,xterm-kitty:extkeys:RGB:clipboard,ghostty:extkeys:RGB:clipboard"

setw -g monitor-activity on
set -g focus-events on

# ensure 'xclip' or 'xsel' is installed on your system
set -g set-clipboard on

## vi
set -g mode-keys vi
set -g status-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -r C-k resize-pane -U 1
bind -r C-j resize-pane -D 1
bind -r C-h resize-pane -L 1
bind -r C-l resize-pane -R 1

# create new session
bind-key -T prefix C-t new-session
# window nav
bind-key -n C-M-h previous-window
bind-key -n C-M-l next-window
# window swap
bind -n C-S-Left swap-window -t -1\; select-window -t -1
bind -n C-S-Right swap-window -t +1\; select-window -t +1

# copy mode
bind-key -T prefix C-u copy-mode \; send-keys scroll-up
# Copy selection to system clipboard (Wayland primary, xclip fallback)
bind -T copy-mode-vi MouseDrag1Pane send-keys -X begin-selection
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy 2>/dev/null || xclip -selection clipboard -in"
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy 2>/dev/null || xclip -selection clipboard -in"
# helix-style: x = select whole line, X = extend selection to end of line
# (with an active selection, end-of-line extends it; without, it just moves)
bind -T copy-mode-vi x send-keys -X select-line
bind -T copy-mode-vi X send-keys -X end-of-line

# right-click pastes instead of showing menu
unbind -T root MouseDown3Pane
bind -T root MouseDown3Pane paste-buffer

# unbind keys to not conflict w/ helix-editor bindings
unbind -T root M-n
unbind M-n
unbind -T root M-p
unbind M-p
unbind -T root M-s
unbind -n M-o
## Unbind C-i from all tables
unbind -n C-i
unbind -T prefix C-i
unbind -T root C-i
unbind -T copy-mode C-i
unbind -T copy-mode-vi C-i
unbind -n Tab
unbind -n C-Tab

bind s setw synchronize-panes \; display-message "synchronize-panes is now #{?pane_synchronized,on,off}"

setw -g main-pane-width 65%
set-hook -g after-split-window 'select-layout'
set-hook -g pane-exited 'select-layout'

bind-key f display-popup -d '#{pane_current_path}' -x R -h 95% -w 95% -E 'tmux new-session yazi \; set status off'

# activate plugins
run '~/.tmux/plugins/tpm/tpm'

# Status modules. Must be set AFTER tpm so @catppuccin_status_* exist:
# `set -gF` expands #{E:...} at set time, and on a fresh server the options
# are only defined once the plugins have loaded. The -F flag flattens the
# #{l:...} literal wrappers, so plain #{cpu_percentage}/#{battery_percentage}
# substrings end up in status-right's raw value; the re-runs below then
# substitute them with #(...) script calls (catppuccin README wiring).
set -ag status-left "#{E:@catppuccin_status_session}"
set -gF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_ram}"
set -agF status-right "#{E:@catppuccin_status_battery}"

# interpolate external-module placeholders into #(script) calls
run '~/.tmux/plugins/tmux-cpu/cpu.tmux'
run '~/.tmux/plugins/tmux-battery/battery.tmux'

# copy mode selection color (overrides catppuccin default, which is set by the
# plugin above). Using Catppuccin Mocha yellow (#f9e2af) as the hue.
# Combined with the terminal's background-opacity + blur, this gives a visible
# but tinted/"transparent" selection highlight (dark text on yellow wash).
set -g mode-style "fg=#1e1e2e,bg=#f9e2af,bold"

